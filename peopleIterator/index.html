<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Iterator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-card: #141414;
            --bg-section: #1a1a1a;
            --text-primary: #fafafa;
            --text-secondary: #737373;
            --accent: #22c55e;
            --accent-secondary: #3b82f6;
            --border: #262626;
        }

        body {
            font-family: 'Instrument Sans', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 40px 20px;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 197, 94, 0.15), transparent);
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .avatar-wrapper {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent), #059669);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-card);
        }

        .header-info h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .header-info .location {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .gender-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .gender-badge.male {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .gender-badge.female {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .profile-info {
            margin-bottom: 24px;
        }

        .info-section {
            background: var(--bg-section);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: left;
        }

        .info-section-title {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-row:first-of-type {
            padding-top: 0;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .info-value {
            font-size: 0.85rem;
            color: var(--text-primary);
            font-weight: 500;
            text-align: right;
            word-break: break-all;
            max-width: 60%;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            background: var(--bg-section);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nationality-flag {
            font-size: 1.3rem;
        }

        #next {
            width: 100%;
            padding: 16px 24px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #next:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }

        #next:active {
            transform: translateY(0);
        }

        #next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .arrow {
            transition: transform 0.2s ease;
        }

        #next:hover .arrow {
            transform: translateX(4px);
        }

        .loading {
            opacity: 0.6;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading .avatar {
            animation: pulse 1.5s infinite;
        }

        .counter {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-section);
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <span class="counter"><span id="current">0</span> / <span id="total">0</span></span>
            
            <div class="header">
                <div class="avatar-wrapper">
                    <img class="avatar" src="" alt="Profile picture">
                </div>
                <div class="header-info">
                    <h3 class="name">Loading...</h3>
                    <p class="location">—</p>
                    <span class="gender-badge">—</span>
                </div>
            </div>

            <div class="profile-info">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value age">—</div>
                        <div class="stat-label">Age</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value nationality-flag">—</div>
                        <div class="stat-label">Nationality</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value member-years">—</div>
                        <div class="stat-label">Member</div>
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-section-title">Contact</div>
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value email">—</span>
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-section-title">Location</div>
                    <div class="info-row">
                        <span class="info-label">City</span>
                        <span class="info-value city">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">State</span>
                        <span class="info-value state">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Country</span>
                        <span class="info-value country">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Postcode</span>
                        <span class="info-value postcode">—</span>
                    </div>
                </div>

            </div>

            <button id="next">
                Next Person
                <span class="arrow">→</span>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
