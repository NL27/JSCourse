<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        #location {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        #error {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            border-radius: 5px;
            color: #c62828;
        }
        #error button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #error button:hover {
            background-color: #1565c0;
        }
        #status {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Geolocation API</h1>
    <p id="status">Getting your current location...</p>
    <div id="location"></div>
    <div id="error"></div>
    
    <script src="./script.js"></script>
</body>
</html>
