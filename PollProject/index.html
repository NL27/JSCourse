<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Poll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f23;
            --bg-card: #1a1a2e;
            --accent: #00d4aa;
            --accent-hover: #00f5c4;
            --text-primary: #e8e8e8;
            --text-muted: #8b8b9e;
            --border-color: #2a2a4a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 212, 170, 0.03) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .poll-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 440px;
            width: 100%;
            position: relative;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(0, 212, 170, 0.1);
        }

        .poll-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .poll-header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .poll-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .poll-option {
            position: relative;
        }

        .poll-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .poll-option label {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-weight: 500;
        }

        .poll-option label:hover {
            background: rgba(0, 212, 170, 0.05);
            border-color: rgba(0, 212, 170, 0.3);
        }

        .poll-option input[type="radio"]:checked + label {
            background: rgba(0, 212, 170, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.15);
        }

        .poll-option input[type="radio"]:disabled + label {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .radio-custom {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .poll-option input[type="radio"]:checked + label .radio-custom {
            border-color: var(--accent);
        }

        .poll-option input[type="radio"]:checked + label .radio-custom::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .option-icon {
            font-size: 1.4rem;
        }

        .btn-vote {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: var(--bg-dark);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-vote:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 170, 0.3);
        }

        .btn-vote:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-vote:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #results {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        #results:empty {
            display: none;
        }

        #results .border-bottom {
            border-color: var(--border-color) !important;
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            padding: 0.85rem 0 !important;
        }

        #results .border-bottom:last-child {
            border-bottom: none !important;
        }

        #results .badge {
            background: var(--accent) !important;
            color: var(--bg-dark);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.4em 0.8em;
        }

        .results-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="poll-container">
        <div class="poll-header">
            <h1>&lt;/&gt; Developer Poll</h1>
            <p>What's your favorite technology to learn in 2025?</p>
        </div>

        <form id="poll-form">
            <div class="poll-options">
                <div class="poll-option">
                    <input type="radio" name="poll-select" id="python" value="Python">
                    <label for="python">
                        <span class="radio-custom"></span>
                        <span class="option-icon">🐍</span>
                        <span>Python</span>
                    </label>
                </div>

                <div class="poll-option">
                    <input type="radio" name="poll-select" id="vue" value="Vue">
                    <label for="vue">
                        <span class="radio-custom"></span>
                        <span class="option-icon">💚</span>
                        <span>Vue.js</span>
                    </label>
                </div>

                <div class="poll-option">
                    <input type="radio" name="poll-select" id="go" value="Go">
                    <label for="go">
                        <span class="radio-custom"></span>
                        <span class="option-icon">🔵</span>
                        <span>Go</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-vote">Cast Your Vote</button>
        </form>

        <div id="results">
            <div class="results-title">Results</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
