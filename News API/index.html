<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science & Research News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            padding: 0 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 2rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: rgba(255, 255, 255, 0.95);
            color: #d32f2f;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin: 2rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .news-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        }

        .news-title {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            color: #1a1a1a;
            margin: 0;
        }

        .news-description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
            margin: 0.75rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9rem;
        }

        .news-source {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .news-source::before {
            content: '📰';
            font-size: 1rem;
        }

        .news-source:hover {
            color: #764ba2;
            transform: translateX(2px);
        }

        .news-source:active {
            transform: translateX(2px) scale(0.98);
        }

        .news-date {
            color: #666;
            font-size: 0.85rem;
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 12px;
            text-align: center;
            color: #666;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .empty-state h2 {
            margin-bottom: 1rem;
            color: #333;
        }

        .filter-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .filter-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1rem;
        }

        .source-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.5rem 1rem;
            background: #f5f5f5;
            border-radius: 8px;
            transition: background 0.2s ease, transform 0.2s ease;
            user-select: none;
        }

        .filter-checkbox:hover {
            background: #e8e8e8;
            transform: translateY(-1px);
        }

        .filter-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .filter-checkbox span {
            font-size: 0.9rem;
            color: #333;
            font-weight: 500;
        }

        .filter-checkbox input[type="checkbox"]:checked + span {
            color: #667eea;
        }

        .date-filter {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .date-input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
        }

        .date-input {
            padding: 0.5rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #333;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .clear-dates-btn {
            padding: 0.5rem 1rem;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .clear-dates-btn:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
            transform: translateY(-1px);
        }

        .clear-dates-btn:active {
            transform: translateY(0);
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            padding-right: 2.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #333;
            background: white;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-input::placeholder {
            color: #999;
        }

        .clear-search-btn {
            position: absolute;
            right: 0.5rem;
            background: #f5f5f5;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            color: #666;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .clear-search-btn:hover {
            background: #e8e8e8;
            transform: scale(1.1);
        }

        .clear-search-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 1200px) {
            .news-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .source-filter {
                flex-direction: column;
                gap: 0.75rem;
            }

            .filter-checkbox {
                width: 100%;
            }

            .date-filter {
                flex-direction: column;
                align-items: stretch;
            }

            .date-input-group {
                width: 100%;
            }

            .date-input {
                flex: 1;
            }

            .clear-dates-btn {
                width: 100%;
            }

            .search-container {
                width: 100%;
            }

            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Science & Research News</h1>
            <p class="subtitle">All articles from leading scientific journals and research institutions</p>
        </header>

        <div class="filter-section">
            <h3 class="filter-title">Search Articles:</h3>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search in titles and descriptions...">
                <button id="clear-search" class="clear-search-btn" style="display: none;">✕</button>
            </div>
            
            <h3 class="filter-title" style="margin-top: 1.5rem;">Filter by Source:</h3>
            <div id="source-filters" class="source-filter"></div>
            
            <h3 class="filter-title" style="margin-top: 1.5rem;">Filter by Date Range:</h3>
            <div class="date-filter">
                <div class="date-input-group">
                    <label for="date-from">From:</label>
                    <input type="date" id="date-from" class="date-input">
                </div>
                <div class="date-input-group">
                    <label for="date-to">To:</label>
                    <input type="date" id="date-to" class="date-input">
                </div>
                <button id="clear-dates" class="clear-dates-btn">Clear Dates</button>
            </div>
        </div>

        <div id="loading" class="loading">Loading news articles</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="news-container" class="news-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
